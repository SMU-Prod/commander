name: Relatório mensal do Commander
on:
  schedule:
    - cron: "0 12 1 * *"   # dia 1, 09:00 em Brasília
  workflow_dispatch:
jobs:
  disparar:
    runs-on: ubuntu-latest
    # Ative depois do deploy: cadastre os secrets COMMANDER_URL e ALERTAS_SEGREDO
    if: ${{ vars.RELATORIOS_ATIVOS == '1' }}
    steps:
      - name: Chamar a rota do relatório mensal
        run: |
          resposta=$(curl -sS -o corpo.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ALERTAS_SEGREDO }}" \
            "${{ secrets.COMMANDER_URL }}/api/relatorio/mensal")
          echo "HTTP $resposta"; cat corpo.json
          test "$resposta" = "200"
